<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primal System PS-1 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: course sidebar (modules, exam, progress) beside one route at a time: home, a module (stepped lesson), or the final exam. Single dark SBSC theme. */
  --bg: #0e0d0c;
  --panel: #191715;
  --line: #2d2a26;
  --ink: #f2eee8;
  --muted: #a39d94;
  --accent: #ff6a13;
  --accent-ink: #1a0b02;
  --good: #4cc38a;
  --bad: #ef5b5b;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; line-height: 1.05; text-wrap: balance; margin: 0; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.brand span { color: var(--accent); }
.tb-right { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.course-progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.bar { width: 140px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.switch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line); position: relative; cursor: pointer; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .2s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); background: var(--accent-ink); }

/* Shell */
.shell { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 58px); }
aside { border-right: 1px solid var(--line); padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; }
aside h2 { font-size: 14px; color: var(--muted); margin: 6px 8px 8px; letter-spacing: .1em; }
.nav { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 9px 8px; border-radius: 8px; font-size: 15px; text-decoration: none; border: 0; background: transparent; text-align: left; width: 100%; }
.nav:hover { background: var(--panel); }
.nav .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; border: 1.5px solid var(--line); color: var(--muted); }
.nav small { display: block; color: var(--muted); font-size: 12px; }
.nav.done .dot { background: var(--good); border-color: var(--good); color: #062014; }
.nav.here { background: var(--panel); }
.nav.here .dot { border-color: var(--accent); color: var(--accent); }
.nav.locked { opacity: .5; cursor: not-allowed; }
.nav.exam .dot { border-radius: 6px; }
.sep { height: 1px; background: var(--line); margin: 10px 8px; }

main { padding: 28px clamp(16px, 4vw, 48px) 64px; max-width: 960px; width: 100%; }
.eyebrow { color: var(--accent); font-family: var(--display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }
.title h1 { font-size: clamp(36px, 5vw, 56px); margin-top: 4px; }
.title p { color: var(--muted); max-width: 64ch; margin: 10px 0 0; }
.objectives { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--muted); font-size: 15px; }
.objectives li::before { content: "▸ "; color: var(--accent); }
.demo-tag { display: inline-block; font-family: var(--display); font-weight: 700; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; padding: 2px 8px; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; vertical-align: middle; margin-left: 8px; }

/* Steps */
.steps { display: flex; gap: 8px; margin: 24px 0; flex-wrap: wrap; }
.step { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; font-weight: 600; }
.step .n { font-family: var(--display); color: var(--muted); }
.step.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.step.active .n { color: var(--accent); }
.step.complete::after { content: "✓"; color: var(--good); font-weight: 700; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 28px); }
.panel h2 { font-size: 30px; margin-bottom: 6px; }
.panel .lede { color: var(--muted); margin: 0 0 18px; max-width: 64ch; }
.stepnext { display: flex; justify-content: flex-end; margin-top: 18px; }

/* Video */
.video { aspect-ratio: 16/9; background: radial-gradient(circle at 70% 30%, #2a2522, #0b0a09); border-radius: 10px; position: relative; overflow: hidden; display: grid; place-items: center; }
.video .play { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); border: 0; display: grid; place-items: center; box-shadow: 0 6px 30px rgba(255,106,19,.35); }
.video .play svg { margin-left: 5px; }
.video .label { position: absolute; left: 18px; bottom: 44px; font-family: var(--display); font-size: 22px; text-transform: uppercase; }
.video .label small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); text-transform: none; }
.video .track { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.12); }
.video .track i { display: block; height: 100%; width: 0; background: var(--accent); }
.chapters { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 6px; }
.chapters li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 8px 10px; border-radius: 8px; font-size: 15px; }
.chapters li.on { background: rgba(255,106,19,.12); }
.chapters time { font-variant-numeric: tabular-nums; color: var(--muted); }

/* Learn */
.setup { display: grid; gap: 10px; counter-reset: s; }
.setup details { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--bg); }
.setup summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 12px; align-items: center; }
.setup summary::-webkit-details-marker { display: none; }
.setup summary::before { counter-increment: s; content: counter(s); font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--accent); width: 18px; flex: none; }
.setup details[open] summary { color: var(--accent); }
.setup details[data-seen] summary::after { content: "✓"; color: var(--good); margin-left: auto; }
.setup .body { margin: 10px 0 2px 30px; color: var(--muted); }
.setup .body b { color: var(--ink); }
.setup .body ul { margin: 6px 0; padding-left: 18px; }
.cue { display: inline-block; margin: 8px 0 0 30px; padding: 3px 10px; border-radius: 999px; background: rgba(255,106,19,.14); color: var(--accent); font-weight: 600; font-size: 14px; }
.evidence { margin-top: 18px; border-left: 3px solid var(--accent); padding: 10px 14px; background: var(--bg); border-radius: 0 8px 8px 0; font-size: 14px; color: var(--muted); }
.evidence b { color: var(--ink); }

/* Shared interactive bits */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 500; }
.opt:hover { border-color: var(--muted); }
.opt.correct { border-color: var(--good); background: rgba(76,195,138,.1); }
.opt.wrong { border-color: var(--bad); background: rgba(239,91,91,.08); }
.feedback { margin-top: 12px; font-size: 15px; min-height: 24px; }
b.ok { color: var(--good); } b.no { color: var(--bad); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
legend, .flabel { font-weight: 600; margin-bottom: 6px; display: block; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.seg input:checked + label { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.rx { background: var(--bg); border: 1px solid var(--accent); border-radius: 12px; padding: 18px; }
.rx .tag { font-family: var(--display); font-size: 13px; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; }
.rx h3 { font-size: 28px; margin: 4px 0 8px; }
.rx p { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
.rx.alert { border-color: var(--bad); }
.rx.alert .tag { color: var(--bad); }
.ladder { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
.ladder span { font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--line); color: var(--muted); }
.ladder span.here { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; margin: 6px 0 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.kv dd.big { font-family: var(--display); font-size: 26px; color: var(--accent); line-height: 1; }

/* M1 sort */
.sort { display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.task.solved { border-color: var(--good); }
.task .btns { display: flex; gap: 6px; }
.task .btns button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 13px; font-weight: 600; }
.task .btns button.wrong { border-color: var(--bad); color: var(--bad); }
.task .btns button.correct { background: var(--good); color: #062014; border-color: var(--good); }
.task .why { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.tally { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.tally span { padding: 6px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; }
.tally b { font-family: var(--display); font-size: 18px; color: var(--accent); margin-left: 4px; }

/* M2 fault finder */
.ff { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 22px; align-items: start; }
.ff svg { width: 100%; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
.clipnav { display: flex; gap: 6px; margin-bottom: 12px; }
.clipnav button { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; font-size: 14px; }
.clipnav button.on { border-color: var(--accent); color: var(--accent); }
.clipnav button.right::after { content: " ✓"; color: var(--good); }

/* M5 prep */
.prep { display: grid; gap: 14px; }
.phase h3 { font-size: 18px; color: var(--accent); margin-bottom: 6px; }
.phase h3 small { color: var(--muted); font-family: var(--body); text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; margin-left: 6px; }
.drill { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); margin-bottom: 6px; }
.drill .d { font-weight: 600; }
.drill .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.drill .s { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.drill.now { border-color: var(--accent); background: rgba(255,106,19,.1); }
.drill.past { opacity: .5; }
.drill.emph .d::after { content: " · emphasis"; color: var(--accent); font-weight: 500; font-size: 13px; }
.runner { position: sticky; top: 74px; background: var(--bg); border: 1px solid var(--accent); border-radius: 12px; padding: 18px; }
.runner .clock { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.runner .cur { font-weight: 700; font-size: 18px; margin-top: 6px; }
.runner .why2 { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
.runner .rbtns { display: flex; gap: 8px; flex-wrap: wrap; }

/* M7 template */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 620px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--display); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--muted); font-weight: 700; }
td .ex { font-weight: 600; }
td .rx2 { color: var(--muted); font-variant-numeric: tabular-nums; }
td .tagp { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--line); color: var(--muted); margin-left: 4px; white-space: nowrap; }
.audit { display: grid; gap: 6px; margin-top: 16px; }
.audit div { display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.audit .ic { font-weight: 800; width: 18px; flex: none; }
.audit .pass .ic { color: var(--good); } .audit .fail .ic { color: var(--bad); }
.audit .fail { color: var(--ink); }
.checks { display: grid; gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.checks input { accent-color: var(--accent); }

/* Quiz */
.q { padding: 16px 0; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; padding-top: 0; }
.q h3 { font-family: var(--body); text-transform: none; letter-spacing: 0; font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.q .tagm { font-size: 12px; color: var(--muted); font-weight: 500; display: block; margin-bottom: 4px; }
.q .opts label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; }
.q .opts input { accent-color: var(--accent); margin-top: 5px; }
.q.graded .why { display: block; }
.why { display: none; margin-top: 8px; font-size: 14px; color: var(--muted); }
.q label.correct { border-color: var(--good); }
.q label.wrong { border-color: var(--bad); }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.btn { padding: 11px 22px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-family: var(--display); font-size: 18px; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.sm { font-size: 15px; padding: 8px 16px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.result { padding: 16px; border-radius: 10px; margin-top: 16px; font-weight: 500; }
.result.pass { background: rgba(76,195,138,.12); border: 1px solid var(--good); }
.result.fail { background: rgba(239,91,91,.1); border: 1px solid var(--bad); }
.result big { font-family: var(--display); font-size: 34px; display: block; }

/* Home */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; align-items: stretch; margin-bottom: 24px; }
.hero .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.stat b { display: block; font-family: var(--display); font-size: 32px; color: var(--accent); line-height: 1; }
.stat span { font-size: 13px; color: var(--muted); }
.howto { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 28px; }
.howto div { border-top: 3px solid var(--accent); padding-top: 10px; font-size: 14px; color: var(--muted); }
.howto div b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; text-decoration: none; }
.mcard:hover { border-color: var(--muted); }
.mcard .num { font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--accent); letter-spacing: .1em; }
.mcard h3 { font-size: 24px; }
.mcard p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.mcard .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.pill.done { border-color: var(--good); color: var(--good); }
.pill.go { border-color: var(--accent); color: var(--accent); }
.mcard.examcard { border-color: var(--accent); grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mcard.locked { opacity: .55; }
.h2s { font-size: 22px; margin: 0 0 12px; color: var(--muted); letter-spacing: .08em; }

/* Exam */
.examhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px; position: sticky; top: 66px; z-index: 2; }
.examhead .timer { font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
.examhead .ans { color: var(--muted); font-size: 14px; }
.blueprint { width: 100%; min-width: 0; margin: 12px 0 18px; }
.blueprint td:last-child, .blueprint th:last-child { text-align: right; font-variant-numeric: tabular-nums; }

/* Certificate */
.cert { margin-top: 18px; background: #f4efe7; color: #17130f; border-radius: 6px; padding: clamp(20px, 5vw, 48px); position: relative; border: 10px solid #17130f; box-shadow: inset 0 0 0 2px var(--accent); text-align: center; }
.cert .org { font-family: var(--display); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 15px; }
.cert .org span { color: var(--accent); }
.cert h2 { font-size: clamp(30px, 5vw, 46px); margin: 14px 0 4px; color: #17130f; }
.cert .lvl { font-family: var(--display); font-size: 20px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.cert .name { font-family: var(--display); font-size: clamp(32px, 6vw, 54px); font-weight: 700; margin: 18px auto 4px; border-bottom: 2px solid #17130f; display: inline-block; padding: 0 24px; min-width: 60%; }
.cert p { max-width: 52ch; margin: 10px auto; font-size: 15px; }
.cert .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; font-size: 13px; flex-wrap: wrap; text-align: left; }
.cert .row b { display: block; font-size: 15px; }
.cert .stamp { position: absolute; top: 14px; right: 18px; font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .1em; color: var(--bad); border: 2px solid var(--bad); padding: 2px 8px; transform: rotate(6deg); }

.note { color: var(--muted); font-size: 13px; margin-top: 28px; }
.hidden { display: none !important; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; overflow-x: auto; padding: 10px 16px; }
  aside h2, .sep { display: none; }
  .nav { grid-template-columns: 28px auto; white-space: nowrap; width: auto; }
  .nav small { display: none; }
  .two, .ff, .hero { grid-template-columns: 1fr; }
  .howto { grid-template-columns: 1fr 1fr; }
  .runner { position: static; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home">Primal <span>System</span> · PS-1</a>
  <div class="tb-right">
    <label class="switch" title="Demo mode unlocks every module and the exam so you can see the full layout"><input type="checkbox" id="demoMode" checked> Demo mode: everything unlocked</label>
    <div class="course-progress"><span id="courseLabel">0 of 7 modules</span><div class="bar"><i id="courseBar"></i></div></div>
  </div>
</header>

<div class="shell">
  <aside aria-label="Course navigation" id="sidebar"></aside>
  <main id="view"></main>
</div>

<script>
/* ================= CONTENT ================= */
const LADDER_DL = ['Hinge patterning', 'Kettlebell deadlift', 'Elevated pull', 'Trap bar deadlift', 'Conventional deadlift'];
const LADDER_PR = ['Landmine press', 'Half-kneeling single-arm press', 'Seated DB press', 'Standing DB press', 'Barbell strict press'];

const MODULES = [
{
  id: 'm1', num: 1, title: 'The Primal Philosophy', short: 'Philosophy', eyebrow: 'Why we train this way', mins: 50,

/* ================= STATE ================= */
let state = { demo: true, passed: {}, steps: {}, examScore: null, certName: '' };
try { const s = JSON.parse(localStorage.getItem('ps1demo') || 'null'); if (s) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem('ps1demo', JSON.stringify(state)); } catch (e) {} }
const passedCount = () => MODULES.filter(m => state.passed[m.id]).length;
function unlocked(i) { return state.demo || i === 0 || !!state.passed[MODULES[i - 1].id]; }
function examUnlocked() { return state.demo || passedCount() === MODULES.length; }
function stepDone(mid, key) { return (state.steps[mid] || []).includes(key); }
function markStep(mid, key) {
  state.steps[mid] = state.steps[mid] || [];
  if (!state.steps[mid].includes(key)) state.steps[mid].push(key);
  save();
  const b = document.querySelector(`.step[data-go="${key}"]`);
  if (b) b.classList.add('complete');
}
let timers = [];
function clearTimers() { timers.forEach(t => clearInterval(t)); timers = []; cancelAnimationFrame(rafId); }
let rafId = 0;

function renderChrome(route) {
  const p = passedCount();
  document.getElementById('courseLabel').textContent = `${p} of 7 modules passed`;
  document.getElementById('courseBar').style.width = Math.round(p / 7 * 100) + '%';
  document.getElementById('demoMode').checked = state.demo;
  const side = document.getElementById('sidebar');
  let h = `<h2>Primal Foundations</h2>
    <a class="nav ${route === 'home' ? 'here' : ''}" href="#home"><div class="dot">⌂</div><div>Course home<small>Overview and progress</small></div></a><div class="sep"></div>`;
  MODULES.forEach((m, i) => {
    const pass = state.passed[m.id], open = unlocked(i);
    const cls = [pass ? 'done' : '', route === m.id ? 'here' : '', open ? '' : 'locked'].join(' ');
    const sub = pass ? `Passed · ${pass}%` : open ? (route === m.id ? 'In progress' : 'Not started') : 'Locked';
    h += open
      ? `<a class="nav ${cls}" href="#${m.id}"><div class="dot">${pass ? '✓' : m.num}</div><div>${m.short}<small>${sub}</small></div></a>`
      : `<div class="nav ${cls}" aria-disabled="true"><div class="dot">${m.num}</div><div>${m.short}<small>${sub}</small></div></div>`;
  });
  h += `<div class="sep"></div>`;
  const eo = examUnlocked(), ep = state.examScore >= 80;
  h += eo
    ? `<a class="nav exam ${ep ? 'done' : ''} ${route === 'exam' ? 'here' : ''}" href="#exam"><div class="dot">${ep ? '✓' : 'EX'}</div><div>PS-1 Final Exam<small>${ep ? 'Certified · ' + state.examScore + '%' : '80% to pass'}</small></div></a>`
    : `<div class="nav exam locked"><div class="dot">EX</div><div>PS-1 Final Exam<small>Pass all 7 modules</small></div></div>`;
  side.innerHTML = h;
}

/* ================= QUIZ COMPONENT ================= */
function quizHTML(qs, prefix, showMod) {
  return qs.map((item, qi) => `<div class="q" data-q="${qi}">${showMod ? `<span class="tagm">Module ${item.mod}</span>` : ''}<h3>${qi + 1}. ${item.q}</h3>
    <div class="opts">${item.o.map((o, oi) => `<label for="${prefix}${qi}o${oi}"><input type="radio" name="${prefix}${qi}" id="${prefix}${qi}o${oi}" value="${oi}">${o}</label>`).join('')}</div>
    <div class="why">${item.why}</div></div>`).join('');
}
function gradeQuiz(form, qs, prefix) {
  const f = new FormData(form);
  let score = 0, answered = 0;
  qs.forEach((item, qi) => { const val = f.get(prefix + qi); if (val !== null) { answered++; if (+val === item.a) score++; } });
  return { score, answered, pct: Math.round(score / qs.length * 100) };
}
function revealQuiz(form, qs) {
  qs.forEach((item, qi) => {
    const box = form.querySelector(`[data-q="${qi}"]`);
    box.classList.add('graded');
    box.querySelectorAll('label').forEach((l, oi) => { const inp = l.querySelector('input'); inp.disabled = true; if (oi === item.a) l.classList.add('correct'); else if (inp.checked) l.classList.add('wrong'); });
  });
}

function renderModuleQuiz(el, m, idx) {
  const draw = () => {
    el.innerHTML = `<h2>Knowledge check</h2><p class="lede">${m.quiz.length} questions. Score 80% or higher to pass${idx < 6 ? ` and unlock Module ${idx + 2}` : ' and finish the coursework'}. Retake as many times as you need.</p>
      ${state.passed[m.id] ? `<div class="result pass" style="margin:0 0 16px">Already passed with ${state.passed[m.id]}%. You can retake it for practice.</div>` : ''}
      <form class="qform">${quizHTML(m.quiz, m.id + 'q', false)}</form>
      <div class="actions"><button class="btn" type="button" data-act="submit">Submit answers</button></div><div class="qres" aria-live="polite"></div>`;
    const form = el.querySelector('.qform'), res = el.querySelector('.qres');
    el.querySelector('[data-act="submit"]').onclick = function () {
      const g = gradeQuiz(form, m.quiz, m.id + 'q');
      if (g.answered < m.quiz.length) { res.innerHTML = `<div class="result fail">Answer all ${m.quiz.length} questions first. You've answered ${g.answered}.</div>`; return; }
      revealQuiz(form, m.quiz);
      this.remove();
      if (g.pct >= 80) {
        state.passed[m.id] = Math.max(state.passed[m.id] || 0, g.pct); save();
        el.parentElement.querySelector('.step[data-go="quiz"]').classList.add('complete');
        const nx = idx < 6 ? `<a class="btn" href="#${MODULES[idx + 1].id}">Start Module ${idx + 2}</a>` : `<a class="btn" href="#exam">Go to the final exam</a>`;
        res.innerHTML = `<div class="result pass"><big>${g.pct}% · Passed</big>${idx < 6 ? `Module ${idx + 2}: ${MODULES[idx + 1].title} is unlocked.` : 'All coursework is complete. The final exam is unlocked once every module is passed.'}</div><div class="actions">${nx}</div>`;
        renderChrome(m.id);
      } else {
        res.innerHTML = `<div class="result fail"><big>${g.pct}% · Not yet</big>You need 80%. Review the explanations, then retake.</div><div class="actions"><button class="btn ghost" type="button" data-act="retry">Retake</button></div>`;
        res.querySelector('[data-act="retry"]').onclick = draw;
      }
    };
  };
  draw();
}

  };
  const phases = [['raise', 'Raise'], ['mob', 'Mobilize'], ['act', 'Activate'], ['pat', 'Pattern']];
  let day = 'pick', flat = [], cur = -1, left = 0, timer = null;
  el.innerHTML = `<h2>Run Primal Prep</h2><p class="lede">Pick the day. The routine shifts its emphasis to match the main lift. Press Start to run it as a guided timer.</p>
    <fieldset><legend>Today’s main lift</legend><div class="seg"><input type="radio" name="pday" id="p-1" value="pick" checked><label for="p-1">Day 1: Pick Up</label><input type="radio" name="pday" id="p-2" value="press"><label for="p-2">Day 2: Press</label><input type="radio" name="pday" id="p-3" value="carry"><label for="p-3">Day 3: Carry</label></div></fieldset>
    <div class="two"><div class="prep"></div><div class="runner"><div class="tag" style="font-family:var(--display);color:var(--accent);letter-spacing:.1em;font-size:13px;text-transform:uppercase">Total <span class="tot"></span></div><div class="clock">0:00</div><div class="cur">Ready</div><div class="why2">Press Start to begin.</div><div class="rbtns"><button type="button" class="btn sm" data-r="start">Start</button><button type="button" class="btn ghost sm" data-r="skip">Skip drill</button><button type="button" class="btn ghost sm" data-r="reset">Reset</button></div></div></div>`;
  const list = el.querySelector('.prep'), clock = el.querySelector('.clock'), curEl = el.querySelector('.cur'), why = el.querySelector('.why2');
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  function build() {
    flat = []; let html = '';
    phases.forEach(([k, l]) => {
      const ds = P[day][k]; const secs = ds.reduce((a, d) => a + d[1], 0);
      html += `<div class="phase"><h3>${l}<small>${fmt(secs)}</small></h3>${ds.map(d => { flat.push(d); return `<div class="drill ${d[3] ? 'emph' : ''}" data-i="${flat.length - 1}"><span class="d">${d[0]}</span><span class="t">${fmt(d[1])}</span><span class="s">Serves: ${d[2]}</span></div>`; }).join('')}</div>`;
    });
    list.innerHTML = html;
    el.querySelector('.tot').textContent = fmt(flat.reduce((a, d) => a + d[1], 0));
    stop(); cur = -1; clock.textContent = fmt(flat[0][1]); curEl.textContent = 'Ready'; why.textContent = 'Press Start to begin.';
  }
  function stop() { if (timer) { clearInterval(timer); timers = timers.filter(t => t !== timer); timer = null; } }
  function show() {
    list.querySelectorAll('.drill').forEach((d, i) => { d.classList.toggle('now', i === cur); d.classList.toggle('past', i < cur); });
    if (cur >= flat.length) { stop(); clock.textContent = '0:00'; curEl.textContent = 'Prep complete'; why.textContent = 'Time for the main lift.'; done(); return; }
    curEl.textContent = flat[cur][0]; why.textContent = 'Serves: ' + flat[cur][2]; clock.textContent = fmt(left);

  build();
};

  if (!examUnlocked()) { v.innerHTML = `<div class="panel"><h2>Final exam locked</h2><p class="lede">Pass all seven module quizzes to unlock the PS-1 Final Exam, or switch on Demo mode at the top.</p><a class="btn" href="#home">Back to course home</a></div>`; return; }
  const blueprint = [['The Primal Philosophy', '10%', 6], ['The Primal Deadlift', '20%', 12], ['The Overhead Press', '20%', 12], ['Loaded Carries', '15%', 9], ['Primal Prep', '10%', 6], ['The Primal Screen', '15%', 9], ['The Base Template', '10%', 6]];
  const intro = () => {
    v.innerHTML = `<div class="title"><div class="eyebrow">Certification</div><h1>PS-1 Final Exam <span class="demo-tag">Demo</span></h1>
      <p>The real exam is 60 questions in 90 minutes: 45 multiple choice and 15 video fault identification, drawn from a larger bank. This demo draws 15 questions from the module checks.</p></div>
      <div class="panel" style="margin-top:22px"><h2>Exam blueprint</h2>
      <div class="tablewrap"><table class="blueprint"><thead><tr><th>Module</th><th>Share</th><th>Questions (real exam)</th></tr></thead><tbody>${blueprint.map(b => `<tr><td>${b[0]}</td><td>${b[1]}</td><td>${b[2]}</td></tr>`).join('')}<tr><td><b>Total</b></td><td><b>100%</b></td><td><b>60</b></td></tr></tbody></table></div>
      <dl class="kv"><dt>Passing score</dt><dd>80% (48 of 60 on the real exam)</dd><dt>Retakes</dt><dd>First retake free after 7 days</dd><dt>On passing</dt><dd>PS-1 Primal Foundations Coach certificate</dd></dl>
      ${state.examScore != null ? `<div class="result ${state.examScore >= 80 ? 'pass' : 'fail'}" style="margin-bottom:12px">Last attempt: ${state.examScore}%</div>` : ''}
      <div class="actions"><button class="btn" type="button" id="startExam">Start the exam</button>${state.examScore >= 80 ? '<button class="btn ghost" type="button" id="viewCert">View certificate</button>' : ''}</div></div>`;
    v.querySelector('#startExam').onclick = start;
    const vc = v.querySelector('#viewCert'); if (vc) vc.onclick = () => showCert(v, state.examScore);
  };
  const start = () => {
    const pool = []; MODULES.forEach(m => m.quiz.forEach(q => pool.push(Object.assign({ mod: m.num }, q))));
    const pick = []; MODULES.forEach(m => { const qs = pool.filter(q => q.mod === m.num).sort(() => Math.random() - .5); pick.push(...qs.slice(0, 2)); });
    const rest = pool.filter(q => !pick.includes(q)).sort(() => Math.random() - .5); pick.push(rest[0]);
    pick.sort((a, b) => a.mod - b.mod);
    let secs = 90 * 60;
    v.innerHTML = `<div class="examhead"><div><b>PS-1 Final Exam</b> <span class="ans">0 of ${pick.length} answered</span></div><div class="timer" aria-label="Time remaining">90:00</div></div>
      <div class="panel"><form class="qform">${quizHTML(pick, 'ex', true)}</form>
      <div class="actions"><button class="btn" type="button" id="submitExam">Submit exam</button></div><div class="qres" aria-live="polite"></div></div>`;
    const form = v.querySelector('.qform'), ans = v.querySelector('.ans'), tm = v.querySelector('.timer');
    form.onchange = () => { ans.textContent = `${new Set([...new FormData(form).keys()]).size} of ${pick.length} answered`; };
    const t = setInterval(() => { secs--; tm.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`; if (secs <= 0) { clearInterval(t); submit(true); } }, 1000);
    timers.push(t);
    const submit = (forced) => {
      const g = gradeQuiz(form, pick, 'ex');
      const res = v.querySelector('.qres');
      if (!forced && g.answered < pick.length) { res.innerHTML = `<div class="result fail">Answer all ${pick.length} questions first. You've answered ${g.answered}.</div>`; return; }
      clearInterval(t);
      revealQuiz(form, pick);
      v.querySelector('#submitExam').remove();
      state.examScore = Math.max(state.examScore || 0, g.pct); save(); renderChrome('exam');
      if (g.pct >= 80) {
        res.innerHTML = `<div class="result pass"><big>${g.pct}% · Passed</big>${g.score} of ${pick.length} correct. You’ve earned PS-1 Primal Foundations.</div><div class="actions"><button class="btn" type="button" id="toCert">See your certificate</button></div>`;
        res.querySelector('#toCert').onclick = () => showCert(v, g.pct);
      } else {
        res.innerHTML = `<div class="result fail"><big>${g.pct}% · Not yet</big>${g.score} of ${pick.length} correct. You need 80%. Review the modules flagged above, then retake.</div><div class="actions"><button class="btn ghost" type="button" id="again">Back to exam overview</button></div>`;
        res.querySelector('#again').onclick = intro;
      }
      window.scrollTo({ top: v.querySelector('.qres').offsetTop - 120 });
    };
    v.querySelector('#submitExam').onclick = () => submit(false);
  };
  intro();
}

  v.innerHTML = `<div class="title"><div class="eyebrow">Certification</div><h1>Your certificate</h1><p>Type your name to preview how the certificate will look.</p></div>
    <div class="panel" style="margin-top:18px"><label class="flabel" for="certName">Name on certificate</label><input class="field" id="certName" value="${(state.certName || '').replace(/"/g, '&quot;')}" placeholder="Your full name" style="max-width:420px">
    <div class="cert"><div class="stamp">DEMO</div><div class="org">Spainhour Bros <span>Strength Co.</span></div>
      <h2>Certificate of Completion</h2><div class="lvl">Primal System · PS-1 Primal Foundations</div>
      <div class="name" id="certShow">${state.certName || 'Your Name'}</div>
      <p>has completed all seven modules of Primal Foundations and passed the PS-1 Final Exam with a score of ${pct}%, and is recognized as a <b>PS-1 Primal Foundations Coach</b>.</p>
      <div class="row"><div>Date<b>${today}</b></div><div>Credential ID<b>${state.certId}</b></div><div>Valid through<b>2 years from issue</b></div></div></div>
    <p class="note">Demo preview only. Not a valid credential.</p><div class="actions"><a class="btn ghost" href="#home">Back to course home</a></div></div>`;
  const inp = v.querySelector('#certName');
  inp.oninput = () => { state.certName = inp.value; v.querySelector('#certShow').textContent = inp.value || 'Your Name'; save(); };
}

/* ================= ROUTER ================= */
function route() {
  clearTimers();
  const h = (location.hash || '#home').slice(1);
  const v = document.getElementById('view');
  const mi = MODULES.findIndex(m => m.id === h);
  if (mi >= 0 && unlocked(mi)) { renderChrome(h); renderModule(v, MODULES[mi]); }
  else if (h === 'exam') { renderChrome('exam'); renderExam(v); }
  else { renderChrome('home'); renderHome(v); }
  window.scrollTo(0, 0);
}
document.getElementById('demoMode').onchange = e => { state.demo = e.target.checked; save(); route(); };
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
